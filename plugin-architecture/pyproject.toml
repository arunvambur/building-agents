[project]
name = "agent-runtime"
version = "0.1.0"
description = "Plugin-based multi-agent runtime built on LangGraph"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name="Arun Venkatesan" }
]

dependencies = [

    # --- Core LLM / Agent stack ---
    "langgraph==1.0.2",
    "langchain==1.0.3",
    "langchain-openai==1.0.1",
    "langchain-community==0.4.1",
    "langchain-chroma==1.0.0",

    # --- Vector DB ---
    "chromadb==1.3.0",

    # --- parsing / scraping ---
    "beautifulsoup4==4.12.1",
    "html2text==2025.4.15",
    "lxml==5.4.0",
    "aiohttp==3.12.13",

    # --- tokenization ---
    "tiktoken==0.9.0",

    # --- env configuration ---
    "python-dotenv==1.1.1",

    # --- MCP support ---
    "langgraph-supervisor==0.0.30",
    "fastmcp==2.10.5",
    "langchain-mcp-adapters==0.1.12",

    # --- API layer ---
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",

    # --- validation ---
    "pydantic>=2.7.0",

    # --- typing helpers ---
    "typing-extensions>=4.9.0",

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


# Optional tool configs
[tool.black]
line-length = 100


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.packages.find]
where = ["runtime"]