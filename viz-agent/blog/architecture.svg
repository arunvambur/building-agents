<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="Inter, ui-sans-serif, system-ui" font-size="13">

  <!-- Background -->
  <rect width="1100" height="920" fill="#0f172a" rx="16"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITLE                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="550" y="44" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="0.5">Viz Agent — System Architecture</text>
  <text x="550" y="66" text-anchor="middle" fill="#64748b" font-size="12">LangGraph · FastAPI · Next.js · SQLite · matplotlib</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER LABELS (left margin)                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="18" y="148" fill="#475569" font-size="10" font-weight="600" transform="rotate(-90,18,148)" text-anchor="middle">INTERFACE</text>
  <text x="18" y="310" fill="#475569" font-size="10" font-weight="600" transform="rotate(-90,18,310)" text-anchor="middle">RUNTIME</text>
  <text x="18" y="530" fill="#475569" font-size="10" font-weight="600" transform="rotate(-90,18,530)" text-anchor="middle">AGENTS</text>
  <text x="18" y="740" fill="#475569" font-size="10" font-weight="600" transform="rotate(-90,18,740)" text-anchor="middle">OUTPUT</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 1 — INTERFACE                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="36" y="88" width="1040" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Chat UI -->
  <rect x="120" y="104" width="200" height="78" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">Chat UI</text>
  <text x="220" y="148" text-anchor="middle" fill="#93c5fd" font-size="10">Next.js · React · Tailwind</text>
  <text x="220" y="164" text-anchor="middle" fill="#60a5fa" font-size="10">localhost:3000</text>

  <!-- CLI -->
  <rect x="380" y="104" width="200" height="78" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">CLI</text>
  <text x="480" y="148" text-anchor="middle" fill="#93c5fd" font-size="10">Interactive Terminal</text>
  <text x="480" y="164" text-anchor="middle" fill="#60a5fa" font-size="10">python -m app.cli.cli</text>

  <!-- REST API -->
  <rect x="640" y="104" width="200" height="78" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="740" y="130" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="600">FastAPI</text>
  <text x="740" y="148" text-anchor="middle" fill="#99f6e4" font-size="10">POST /visualize</text>
  <text x="740" y="164" text-anchor="middle" fill="#5eead4" font-size="10">GET /download/{id}</text>

  <!-- Swagger -->
  <rect x="880" y="104" width="160" height="78" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="960" y="130" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="600">Swagger UI</text>
  <text x="960" y="148" text-anchor="middle" fill="#99f6e4" font-size="10">API Docs</text>
  <text x="960" y="164" text-anchor="middle" fill="#5eead4" font-size="10">localhost:8000/docs</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ARROW: Interface → Runtime                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="550" y1="198" x2="550" y2="228" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="550,228 545,218 555,218" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 2 — RUNTIME                                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="36" y="228" width="1040" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Guardrail -->
  <rect x="80" y="248" width="220" height="120" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="190" y="276" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="700">Guardrail</text>
  <text x="190" y="296" text-anchor="middle" fill="#fdba74" font-size="10">Keyword fast-pass</text>
  <text x="190" y="312" text-anchor="middle" fill="#fdba74" font-size="10">LLM fallback filter</text>
  <text x="190" y="332" text-anchor="middle" fill="#fb923c" font-size="10" font-style="italic">Blocks off-topic queries</text>
  <!-- Block arrow -->
  <rect x="82" y="354" width="216" height="14" rx="4" fill="#991b1b" opacity="0.6"/>
  <text x="190" y="364" text-anchor="middle" fill="#fca5a5" font-size="9">✗  off-topic → blocked</text>

  <!-- Intent Classifier -->
  <rect x="360" y="248" width="220" height="120" rx="8" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
  <text x="470" y="276" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="700">Intent Classifier</text>
  <text x="470" y="296" text-anchor="middle" fill="#d8b4fe" font-size="10">Keyword regex (fast)</text>
  <text x="470" y="312" text-anchor="middle" fill="#d8b4fe" font-size="10">LLM structured output</text>
  <!-- Intent badges -->
  <rect x="368" y="326" width="56" height="18" rx="4" fill="#1d4ed8"/>
  <text x="396" y="338" text-anchor="middle" fill="#bfdbfe" font-size="9" font-weight="600">data</text>
  <rect x="432" y="326" width="48" height="18" rx="4" fill="#0f766e"/>
  <text x="456" y="338" text-anchor="middle" fill="#ccfbf1" font-size="9" font-weight="600">viz</text>
  <rect x="488" y="326" width="52" height="18" rx="4" fill="#7c3aed"/>
  <text x="514" y="338" text-anchor="middle" fill="#ede9fe" font-size="9" font-weight="600">both</text>

  <!-- Supervisor -->
  <rect x="640" y="248" width="220" height="120" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="750" y="276" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">Supervisor</text>
  <text x="750" y="296" text-anchor="middle" fill="#93c5fd" font-size="10">LangGraph StateGraph</text>
  <text x="750" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Routes by intent + flags</text>
  <text x="750" y="332" text-anchor="middle" fill="#60a5fa" font-size="10">InMemorySaver checkpointer</text>

  <!-- LLM Provider box -->
  <rect x="880" y="248" width="160" height="120" rx="8" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
  <text x="960" y="276" text-anchor="middle" fill="#e7e5e4" font-size="11" font-weight="700">LLM Provider</text>
  <rect x="892" y="288" width="136" height="22" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <text x="960" y="303" text-anchor="middle" fill="#bfdbfe" font-size="10">OpenAI gpt-4o-mini</text>
  <rect x="892" y="316" width="136" height="22" rx="4" fill="#166534" opacity="0.8"/>
  <text x="960" y="331" text-anchor="middle" fill="#bbf7d0" font-size="10">Ollama llama3.1 / qwen2.5</text>
  <text x="960" y="356" text-anchor="middle" fill="#78716c" font-size="9">via .env LLM_PROVIDER</text>

  <!-- Runtime arrows -->
  <line x1="300" y1="308" x2="358" y2="308" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="358,308 348,303 348,313" fill="#f97316"/>
  <text x="329" y="302" text-anchor="middle" fill="#fb923c" font-size="9">allowed</text>

  <line x1="580" y1="308" x2="638" y2="308" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="638,308 628,303 628,313" fill="#a855f7"/>

  <line x1="860" y1="308" x2="862" y2="308" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ARROW: Runtime → Agents                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="550" y1="388" x2="550" y2="418" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="550,418 545,408 555,408" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 3 — AGENTS                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="36" y="418" width="1040" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- DATA AGENT box -->
  <rect x="60" y="438" width="460" height="220" rx="10" fill="#0c1a2e" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="60" y="438" width="460" height="32" rx="10" fill="#1d4ed8"/>
  <rect x="60" y="458" width="460" height="12" rx="0" fill="#1d4ed8"/>
  <text x="290" y="459" text-anchor="middle" fill="#eff6ff" font-size="12" font-weight="700">Data Intelligent Agent</text>

  <!-- Data agent internals -->
  <rect x="76" y="480" width="200" height="80" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
  <text x="176" y="500" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="600">LLM Node</text>
  <text x="176" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">Binds SQLite tools</text>
  <text x="176" y="530" text-anchor="middle" fill="#93c5fd" font-size="9">Calls tool if needed</text>
  <text x="176" y="546" text-anchor="middle" fill="#60a5fa" font-size="9">Returns raw records</text>

  <rect x="296" y="480" width="200" height="80" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
  <text x="396" y="500" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="600">SQLite Tools</text>
  <text x="396" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">search_hotels</text>
  <text x="396" y="530" text-anchor="middle" fill="#93c5fd" font-size="9">get_room_offers</text>
  <text x="396" y="546" text-anchor="middle" fill="#93c5fd" font-size="9">list_all_hotels_with_offers</text>

  <!-- SQLite DB -->
  <rect x="76" y="576" width="420" height="68" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="286" y="598" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">cornwall_hotels.db  (SQLite)</text>
  <text x="286" y="616" text-anchor="middle" fill="#64748b" font-size="9">hotels · hotel_room_offers  —  10 hotels, Cornwall UK</text>
  <text x="286" y="632" text-anchor="middle" fill="#475569" font-size="9">hotel_name · town · rating · available_rooms · price_single · price_double</text>

  <!-- Arrow LLM → Tools -->
  <line x1="276" y1="520" x2="294" y2="520" stroke="#3b82f6" stroke-width="1.2"/>
  <polygon points="294,520 284,515 284,525" fill="#3b82f6"/>

  <!-- Arrow Tools → DB -->
  <line x1="396" y1="560" x2="396" y2="574" stroke="#3b82f6" stroke-width="1.2"/>
  <polygon points="396,574 391,564 401,564" fill="#3b82f6"/>

  <!-- VIZ AGENT box -->
  <rect x="580" y="438" width="460" height="220" rx="10" fill="#0c1a2e" stroke="#0f766e" stroke-width="2"/>
  <rect x="580" y="438" width="460" height="32" rx="10" fill="#0f766e"/>
  <rect x="580" y="458" width="460" height="12" rx="0" fill="#0f766e"/>
  <text x="810" y="459" text-anchor="middle" fill="#f0fdf4" font-size="12" font-weight="700">Visualization Agent</text>

  <!-- Viz agent internals -->
  <rect x="596" y="480" width="200" height="80" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="696" y="500" text-anchor="middle" fill="#ccfbf1" font-size="10" font-weight="600">LLM Node</text>
  <text x="696" y="516" text-anchor="middle" fill="#99f6e4" font-size="9">Reads data from context</text>
  <text x="696" y="530" text-anchor="middle" fill="#99f6e4" font-size="9">Builds VisualizationSpec</text>
  <text x="696" y="546" text-anchor="middle" fill="#5eead4" font-size="9">Calls render_visualization</text>

  <rect x="816" y="480" width="200" height="80" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="916" y="500" text-anchor="middle" fill="#ccfbf1" font-size="10" font-weight="600">DSL Validator</text>
  <text x="916" y="516" text-anchor="middle" fill="#99f6e4" font-size="9">VisualizationSpec schema</text>
  <text x="916" y="530" text-anchor="middle" fill="#99f6e4" font-size="9">14 chart types</text>
  <text x="916" y="546" text-anchor="middle" fill="#5eead4" font-size="9">Semantic validation</text>

  <!-- Renderer Registry -->
  <rect x="596" y="576" width="420" height="68" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="806" y="598" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Renderer Registry</text>
  <rect x="604" y="608" width="88" height="26" rx="4" fill="#1d4ed8" opacity="0.7"/>
  <text x="648" y="625" text-anchor="middle" fill="#bfdbfe" font-size="9">Image (PNG)</text>
  <rect x="700" y="608" width="88" height="26" rx="4" fill="#166534" opacity="0.7"/>
  <text x="744" y="625" text-anchor="middle" fill="#bbf7d0" font-size="9">Excel (.xlsx)</text>
  <rect x="796" y="608" width="88" height="26" rx="4" fill="#7c2d12" opacity="0.7"/>
  <text x="840" y="625" text-anchor="middle" fill="#fed7aa" font-size="9">PDF (.pdf)</text>
  <rect x="892" y="608" width="88" height="26" rx="4" fill="#4c1d95" opacity="0.7"/>
  <text x="936" y="625" text-anchor="middle" fill="#e9d5ff" font-size="9">PPT (.pptx)</text>

  <!-- Arrow LLM → DSL -->
  <line x1="796" y1="520" x2="814" y2="520" stroke="#14b8a6" stroke-width="1.2"/>
  <polygon points="814,520 804,515 804,525" fill="#14b8a6"/>

  <!-- Arrow DSL → Renderer -->
  <line x1="916" y1="560" x2="916" y2="574" stroke="#14b8a6" stroke-width="1.2"/>
  <polygon points="916,574 911,564 921,564" fill="#14b8a6"/>

  <!-- Data Agent → Viz Agent data flow arrow -->
  <line x1="520" y1="548" x2="578" y2="548" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="578,548 568,543 568,553" fill="#f59e0b"/>
  <text x="549" y="540" text-anchor="middle" fill="#fbbf24" font-size="9">raw data</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ARROW: Agents → Output                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="550" y1="678" x2="550" y2="708" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="550,708 545,698 555,698" fill="#475569"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 4 — OUTPUT                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="36" y="708" width="1040" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="556" y="730" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Response Types</text>

  <!-- Text response -->
  <rect x="60" y="742" width="220" height="126" rx="8" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
  <rect x="60" y="742" width="220" height="28" rx="8" fill="#292524"/>
  <rect x="60" y="758" width="220" height="12" rx="0" fill="#292524"/>
  <text x="170" y="760" text-anchor="middle" fill="#e7e5e4" font-size="11" font-weight="600">Text Response</text>
  <text x="170" y="784" text-anchor="middle" fill="#a8a29e" font-size="10">type: "text"</text>
  <text x="170" y="800" text-anchor="middle" fill="#78716c" font-size="9">Formatted table or</text>
  <text x="170" y="814" text-anchor="middle" fill="#78716c" font-size="9">plain text answer</text>
  <text x="170" y="832" text-anchor="middle" fill="#57534e" font-size="9">Data-only queries</text>
  <text x="170" y="848" text-anchor="middle" fill="#57534e" font-size="9">e.g. "list all hotels"</text>

  <!-- Image response -->
  <rect x="310" y="742" width="220" height="126" rx="8" fill="#0c1a2e" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="310" y="742" width="220" height="28" rx="8" fill="#1e3a5f"/>
  <rect x="310" y="758" width="220" height="12" rx="0" fill="#1e3a5f"/>
  <text x="420" y="760" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">Image Response</text>
  <text x="420" y="784" text-anchor="middle" fill="#93c5fd" font-size="10">type: "image"</text>
  <text x="420" y="800" text-anchor="middle" fill="#60a5fa" font-size="9">Base64 PNG</text>
  <text x="420" y="814" text-anchor="middle" fill="#60a5fa" font-size="9">Displayed inline in chat</text>
  <text x="420" y="832" text-anchor="middle" fill="#3b82f6" font-size="9">14 chart types</text>
  <text x="420" y="848" text-anchor="middle" fill="#3b82f6" font-size="9">e.g. "show a bar chart"</text>

  <!-- File response -->
  <rect x="560" y="742" width="220" height="126" rx="8" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="560" y="742" width="220" height="28" rx="8" fill="#134e4a"/>
  <rect x="560" y="758" width="220" height="12" rx="0" fill="#134e4a"/>
  <text x="670" y="760" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="600">File Download</text>
  <text x="670" y="784" text-anchor="middle" fill="#99f6e4" font-size="10">type: "file"</text>
  <text x="670" y="800" text-anchor="middle" fill="#5eead4" font-size="9">Excel · PDF · PowerPoint</text>
  <text x="670" y="814" text-anchor="middle" fill="#5eead4" font-size="9">Download card in chat</text>
  <text x="670" y="832" text-anchor="middle" fill="#2dd4bf" font-size="9">GET /download/{file_id}</text>
  <text x="670" y="848" text-anchor="middle" fill="#2dd4bf" font-size="9">e.g. "generate Excel report"</text>

  <!-- Blocked response -->
  <rect x="810" y="742" width="220" height="126" rx="8" fill="#1c0a09" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="810" y="742" width="220" height="28" rx="8" fill="#450a0a"/>
  <rect x="810" y="758" width="220" height="12" rx="0" fill="#450a0a"/>
  <text x="920" y="760" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="600">Blocked Response</text>
  <text x="920" y="784" text-anchor="middle" fill="#fca5a5" font-size="10">type: "text"</text>
  <text x="920" y="800" text-anchor="middle" fill="#f87171" font-size="9">Guardrail rejection</text>
  <text x="920" y="814" text-anchor="middle" fill="#f87171" font-size="9">Off-topic query</text>
  <text x="920" y="832" text-anchor="middle" fill="#ef4444" font-size="9">No agent invoked</text>
  <text x="920" y="848" text-anchor="middle" fill="#ef4444" font-size="9">e.g. "what is the weather?"</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGEND                                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="36" y="896" width="1040" height="18" rx="4" fill="#0f172a"/>
  <line x1="60" y1="905" x2="90" y2="905" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="96" y="909" fill="#64748b" font-size="10">Control flow</text>
  <line x1="180" y1="905" x2="210" y2="905" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="216" y="909" fill="#64748b" font-size="10">Data handoff</text>
  <line x1="300" y1="905" x2="330" y2="905" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="336" y="909" fill="#64748b" font-size="10">Internal call</text>
  <circle cx="430" cy="905" r="5" fill="#1d4ed8"/>
  <text x="440" y="909" fill="#64748b" font-size="10">Chat UI / API</text>
  <circle cx="530" cy="905" r="5" fill="#0f766e"/>
  <text x="540" y="909" fill="#64748b" font-size="10">Viz Agent</text>
  <circle cx="620" cy="905" r="5" fill="#7c2d12"/>
  <text x="630" y="909" fill="#64748b" font-size="10">Guardrail</text>
  <circle cx="710" cy="905" r="5" fill="#4c1d95"/>
  <text x="720" y="909" fill="#64748b" font-size="10">Intent / Supervisor</text>

</svg>
